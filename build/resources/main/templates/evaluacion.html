<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Evaluación - EduNivel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 60%; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; display: block; text-align: center; text-decoration: none; box-sizing: border-box; }
        .btn:hover { background-color: #218838; }
        .btn-volver { background-color: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; display: block; text-align: center; text-decoration: none; box-sizing: border-box; margin-top: 10px; }
        .btn-volver:hover { background-color: #5a6268; }
        .info { background-color: #fff3cd; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Evaluación de Estudiante</h1>
        
        <div class="info">
            <strong>Instrucciones:</strong> Ingresa las calificaciones de cada área (0 a 100). 
            El sistema calculará automáticamente el nivel del estudiante.
        </div>

        <form action="/procesar-evaluacion" method="POST">
            <div class="form-group">
                <label for="id_estudiante">Seleccionar Estudiante:</label>
                <select id="id_estudiante" name="id_estudiante" required>
                    <option value="">-- Seleccione un estudiante --</option>
                    <option th:each="est : ${estudiantes}" 
                            th:value="${est.id_estudiante}" 
                            th:text="${est.codigo} + ' - ' + ${est.curso} + ' ' + ${est.paralelo}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="matematica">📐 Matemática (0-100):</label>
                <input type="number" id="matematica" name="matematica" min="0" max="100" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="comprension_lectora">📖 Comprensión Lectora (0-100):</label>
                <input type="number" id="comprension_lectora" name="comprension_lectora" min="0" max="100" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="razonamiento_logico">🧩 Razonamiento Lógico (0-100):</label>
                <input type="number" id="razonamiento_logico" name="razonamiento_logico" min="0" max="100" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="competencia_digital">💻 Competencia Digital (0-100):</label>
                <input type="number" id="competencia_digital" name="competencia_digital" min="0" max="100" step="0.01" required>
            </div>

            <button type="submit" class="btn">Calcular Nivel</button>
        </form>

        <a href="/" class="btn-volver">Volver al inicio</a>
    </div>
</body>
</html>
