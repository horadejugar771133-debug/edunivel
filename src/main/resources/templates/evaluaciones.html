<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todas las Evaluaciones - EduNivel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 80%; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #0056b3; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .btn-volver { background-color: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; }
        .nivel-alto { color: green; font-weight: bold; }
        .nivel-medio { color: orange; font-weight: bold; }
        .nivel-bajo { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Todas las Evaluaciones</h1>

        <table th:if="${!#lists.isEmpty(evaluaciones)}">
            <thead>
                <tr>
                    <th>ID Evaluación</th>
                    <th>ID Estudiante</th>
                    <th>Matemática</th>
                    <th>Comprensión Lectora</th>
                    <th>Razonamiento Lógico</th>
                    <th>Competencia Digital</th>
                    <th>Puntaje General</th>
                    <th>Nivel</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ev : ${evaluaciones}">
                    <td th:text="${ev.id_evaluacion}"></td>
                    <td th:text="${ev.id_estudiante}"></td>
                    <td th:text="${ev.matematica}"></td>
                    <td th:text="${ev.comprension_lectora}"></td>
                    <td th:text="${ev.razonamiento_logico}"></td>
                    <td th:text="${ev.competencia_digital}"></td>
                    <td th:text="${#numbers.formatDecimal(ev.puntaje_general, 1, 2)}"></td>
                    <td th:class="${ev.nivel == 'ALTO'} ? 'nivel-alto' : (${ev.nivel == 'MEDIO'} ? 'nivel-medio' : 'nivel-bajo')" 
                        th:text="${ev.nivel}"></td>
                </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(evaluaciones)}" style="text-align: center; color: gray; font-size: 18px;">
            📭 No hay evaluaciones registradas aún.
        </p>

        <a href="/" class="btn-volver">Volver al inicio</a>
    </div>
</body>
</html>
